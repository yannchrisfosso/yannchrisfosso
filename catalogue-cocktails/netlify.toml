"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Site statique (aucune commande de build) + fonctions pour « Disponibles ce soir ».
[build]
  publish = "site"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Page propriétaire : /bar (non référencée, jamais indexée)
[[redirects]]
  from = "/bar"
  to = "/bar.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/bar"
  status = 302

[[headers]]
  for = "/bar"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/bar.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

# N-07 : en-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
